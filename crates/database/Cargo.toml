[package]
name = "todo-database"
version = "0.1.0"
edition = "2024"
description = "Persistence layer: secret loading, MariaDB accounts (Argon2id + AES-GCM-SIV PII), Redis sessions, PostgreSQL object metadata"

[dependencies]
todo-crypto = { workspace = true }
sqlx = { workspace = true }
argon2 = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["time"] }
redis = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }
toml = { workspace = true }
